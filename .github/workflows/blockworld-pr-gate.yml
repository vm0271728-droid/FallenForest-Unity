name: BlockWorld Build Gate

on:
  push:
    branches: [blockworld-godot-build]
    paths:
      - '.github/workflows/blockworld-pr-gate.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_WORKFLOW: blockworld-android.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: blockworld-godot-build

      - name: Publish running marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cat > BlockWorld_CI_LAST_SUCCESS.txt <<EOF
          status=running
          gate_run_id=$GITHUB_RUN_ID
          gate_head=$(git rev-parse HEAD)
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add BlockWorld_CI_LAST_SUCCESS.txt
          git commit -m 'Record running BlockWorld Android build'
          git push origin HEAD:blockworld-godot-build

      - name: Fix source extraction packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/blockworld-android.yml')
          s=p.read_text()
          old='''          rm -rf BlockWorld\n          mkdir -p BlockWorld\n          unzip -q "$RUNNER_TEMP/BlockWorld_Source.zip" -d BlockWorld\n          test -f BlockWorld/project.godot'''
          new='''          rm -rf BlockWorld\n          unzip -q "$RUNNER_TEMP/BlockWorld_Source.zip" -d .\n          test -f BlockWorld/project.godot'''
          if old in s:
              s=s.replace(old,new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected extraction block not found')
          PY
          git add .github/workflows/blockworld-android.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Fix BlockWorld CI source extraction'
            git push origin HEAD:blockworld-godot-build
          fi

      - name: Dispatch BlockWorld Android build
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$REPO" --workflow "$TARGET_WORKFLOW" --branch blockworld-godot-build --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"
          gh workflow run "$TARGET_WORKFLOW" --repo "$REPO" --ref blockworld-godot-build

      - name: Locate dispatched run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --repo "$REPO" --workflow "$TARGET_WORKFLOW" --branch blockworld-godot-build --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$BEFORE" ]; then break; fi
            RUN_ID=""
            sleep 2
          done
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Dispatched run: $RUN_ID"

      - name: Wait for tested Android build
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status

      - name: Download tested artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p collected
          gh run download "$RUN_ID" --repo "$REPO" --name BlockWorld-Android --dir collected
          test -s collected/BlockWorld.apk
          test -s collected/BlockWorld.apk.sha256
          cat collected/BlockWorld.apk.sha256

      - name: Upload gated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-Android-Gated
          if-no-files-found: error
          retention-days: 7
          path: |
            collected/BlockWorld.apk
            collected/BlockWorld.apk.sha256
            collected/apk-badging.txt
            collected/install-result.txt
            collected/runtime-smoke.txt
            collected/runtime-logcat.txt

      - name: Publish success marker
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(awk '{print $1}' collected/BlockWorld.apk.sha256)"
          cat > BlockWorld_CI_LAST_SUCCESS.txt <<EOF
          status=success
          target_run_id=$RUN_ID
          apk_sha256=$HASH
          gate_run_id=$GITHUB_RUN_ID
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add BlockWorld_CI_LAST_SUCCESS.txt
          git commit -m 'Record successful BlockWorld Android build'
          git push origin HEAD:blockworld-godot-build
