# Cloud Unity Personal build; secrets are configured in GitHub Actions
name: Build Fallen Forest APK

on:
  workflow_dispatch:
  push:
    branches: [ main, integration/release-mainline ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'ThirdParty/UserUploads/**'
      - 'Tools/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: fallen-forest-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout project and LFS assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Import and verify canonical user release archive
        shell: bash
        run: |
          set -euo pipefail

          expected_size='85825470'
          expected_sha256='0848ea17b01f750747a37e3af9b0e74723efcba58a253c20e798e30b41a5e9d8'
          drive_file_id='1W9RzSrC8SWn1BJCa_i0OU2Wkk0L0LQe6'

          archive=''
          for candidate in \
            'ThirdParty/UserUploads/all-needed.zip' \
            'ThirdParty/UserUploads/все нужное.zip'; do
            if [ -f "$candidate" ]; then
              archive="$candidate"
              break
            fi
          done

          if [ -z "$archive" ] && [ -d ThirdParty/UserUploads ]; then
            archive="$(find ThirdParty/UserUploads -maxdepth 1 -type f -iname '*.zip' -size +50M -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$archive" ]; then
            archive='ThirdParty/UserUploads/all-needed.zip'
            mkdir -p "$(dirname "$archive")"
            echo 'Canonical archive is not stored in Git; downloading the approved Google Drive source.'
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 900 \
              "https://drive.usercontent.google.com/download?id=${drive_file_id}&export=download&confirm=t" \
              --output "$archive"
          fi

          test -f "$archive" || {
            echo 'MISSING CANONICAL ARCHIVE after repository/Drive resolution.' >&2
            exit 3
          }

          actual_size="$(stat -c '%s' "$archive")"
          if [ "$actual_size" != "$expected_size" ]; then
            echo "CANONICAL ARCHIVE SIZE MISMATCH: expected $expected_size bytes, got $actual_size." >&2
            file "$archive" || true
            head -c 160 "$archive" | strings || true
            exit 3
          fi

          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "CANONICAL ARCHIVE SHA-256 MISMATCH: expected $expected_sha256, got $actual_sha256." >&2
            exit 3
          fi

          echo "Canonical archive verified: $archive ($actual_size bytes, sha256=$actual_sha256)"
          python3 Tools/import_all_needed_archive.py "$archive"

          require_file() { test -f "$1" || { echo "MISSING AFTER IMPORT: $1" >&2; exit 4; }; }
          require_file Assets/FallenForest/Art/Vegetation/UserGrass/Source/Grass.fbx
          require_file Assets/FallenForest/Art/Viewmodel/Arms/Source/fpsarms.fbx
          require_file Assets/FallenForest/Art/Viewmodel/Flashlight/Source/flashlightfbx.fbx
          require_file Assets/FallenForest/Art/Documents/UserDocument/Source/document_file_folder.obj
          require_file 'Assets/FallenForest/Art/Vehicles/Pickup/Source/Pickup Afghanistan.fbx'
          require_file 'Assets/FallenForest/Art/Models/DoctorNowhere/Locust/Source/T_O_E Locust - By Doumty.fbx'
          require_file Assets/FallenForest/Art/Models/DoctorNowhere/Boiled/Source/BoiledOne.fbx
          require_file Assets/FallenForest/Audio/Screamers/jakes-screamer.mp3
          require_file Assets/FallenForest/Audio/Screamers/the-screamer-shared-between-mallie-and-jenny.mp3
          require_file Assets/FallenForest/Video/boiled_one_jumpscare.mp4

          if [ -f Assets/FallenForest/Audio/Screamers/amazing-grace-analog-horror.mp3 ]; then
            echo 'FORBIDDEN FILE PRESENT AFTER IMPORT: amazing-grace-analog-horror.mp3' >&2
            exit 5
          fi
          echo 'Canonical user release archive validation passed before Unity installation.'

      - name: Fetch vetted CC0 menu and forest ambience
        run: python3 Tools/fetch_cc0_audio.py

      - name: Verify Unity ID credentials exist
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_USERNAME" || { echo 'Missing GitHub secret: UNITY_USERNAME'; exit 2; }
          test -n "$UNITY_PASSWORD" || { echo 'Missing GitHub secret: UNITY_PASSWORD'; exit 2; }

      - name: Free disk for Unity Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo 'Disk after cleanup:'
          df -h /

      - name: Install Unity Hub and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub-dist.unity3d.com/artifactory/hub-debian-prod-local stable main' | sudo tee /etc/apt/sources.list.d/unityhub.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unityhub xvfb

          if [ -x /usr/lib/unityhub/unityhub ]; then
            hub=/usr/lib/unityhub/unityhub
          elif [ -x /opt/unityhub/unityhub ]; then
            hub=/opt/unityhub/unityhub
          else
            hub="$(command -v unityhub)"
          fi
          test -x "$hub" || { echo 'Unity Hub package installed but executable was not found.' >&2; exit 1; }

          licensing_client="$(find "$(dirname "$hub")" -maxdepth 5 -type f -name Unity.Licensing.Client -perm -111 -print -quit 2>/dev/null || true)"
          test -n "$licensing_client" || {
            echo "Unity.Licensing.Client was not found under the real Hub directory: $(dirname "$hub")" >&2
            find "$(dirname "$hub")" -maxdepth 5 -type f -iname '*Licensing*' -print 2>/dev/null | head -80 || true
            exit 1
          }

          echo "UNITY_HUB_PATH=$hub" >> "$GITHUB_ENV"
          echo "Unity Hub installed at: $hub"
          echo "Unity Licensing Client: $licensing_client"
          xvfb-run -a "$hub" --headless help --errors | head -80

      - name: Install Unity 6.0.76f1 and Android modules with Hub CLI
        shell: bash
        run: |
          set -euo pipefail
          install_root="$HOME/Unity/Hub/Editor"
          mkdir -p "$install_root"
          xvfb-run -a "$UNITY_HUB_PATH" --headless install-path -s "$install_root" --errors
          xvfb-run -a "$UNITY_HUB_PATH" --headless install \
            --version 6000.0.76f1 \
            --changeset 6f7f9e1c9e8a \
            --module android \
            --childModules \
            --errors
          xvfb-run -a "$UNITY_HUB_PATH" --headless editors -i --errors || true

          editor="$install_root/6000.0.76f1/Editor/Unity"
          if [ ! -x "$editor" ]; then
            editor="$(find "$HOME/Unity" -type f -path '*/6000.0.76f1/Editor/Unity' -perm -111 -print -quit 2>/dev/null || true)"
          fi
          test -x "$editor" || {
            echo 'Unity 6000.0.76f1 did not produce an Editor executable.' >&2
            find "$HOME/Unity" -maxdepth 8 -type f -name Unity -perm -111 -print 2>/dev/null || true
            exit 1
          }
          echo "UNITY_EDITOR_PATH=$editor" >> "$GITHUB_ENV"
          echo "Resolved Unity Editor: $editor"

      - name: Verify Unity Android installation
        shell: bash
        run: |
          set -euo pipefail
          test -x "$UNITY_EDITOR_PATH" || { echo 'Unity editor executable is missing.' >&2; exit 1; }
          android_player="$(dirname "$UNITY_EDITOR_PATH")/Data/PlaybackEngines/AndroidPlayer"
          test -d "$android_player" || { echo "Android Build Support missing: $android_player" >&2; exit 1; }
          test -f "$android_player/UnityEditor.Android.Extensions.dll" || { echo 'Unity Android editor extension missing.' >&2; exit 1; }
          test -d "$android_player/SDK/platform-tools" || { echo 'Unity Android SDK missing/incomplete.' >&2; exit 1; }
          test -f "$android_player/NDK/source.properties" || { echo 'Unity Android NDK missing/incomplete.' >&2; find "$android_player/NDK" -maxdepth 2 -type f -print 2>/dev/null | head -40 || true; exit 1; }
          test -x "$android_player/OpenJDK/bin/java" || { echo 'Unity OpenJDK missing/incomplete.' >&2; exit 1; }
          grep -E 'Pkg.Revision|Pkg.Desc' "$android_player/NDK/source.properties" || cat "$android_player/NDK/source.properties"
          "$android_player/OpenJDK/bin/java" -version
          echo 'Unity Android toolchain validation passed.'
          df -h /

      - name: Activate Unity Personal on the cloud runner
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Compile/import Unity project
        shell: bash
        run: |
          set -uo pipefail
          test -x "$UNITY_EDITOR_PATH"
          log="$RUNNER_TEMP/unity-compile-import.log"

          set +e
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -logFile "$log"
          rc=$?
          set -e

          cat "$log" || true

          if grep -Eq 'error CS[0-9]{4}' "$log"; then
            echo 'C# compiler error detected in Unity compile/import log.' >&2
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            echo 'Unity compile/import completed cleanly.'
            exit 0
          fi

          if [ "$rc" -eq 134 ] \
            && grep -Fq 'Batchmode quit successfully invoked - shutting down!' "$log" \
            && grep -Fq 'Cannot create web request without initializing the system' "$log" \
            && grep -Fq 'UnityEngine::Analytics::DataDispatcher' "$log"; then
            echo '::warning::Unity 6 Linux Editor hit the verified Analytics shutdown race after successful batchmode quit; compile/import is accepted.'
            exit 0
          fi

          echo "Unity compile/import failed with exit code $rc." >&2
          exit "$rc"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build and verify development-signed APK
        shell: bash
        run: |
          set -uo pipefail
          apk='Builds/Android/Fallen_Forest_1.0.0.apk'
          log="$RUNNER_TEMP/unity-release-build.log"
          rm -f "$apk"

          set +e
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod FallenForest.EditorTools.FallenForestProjectBuilder.CIBuildAndroid \
            -logFile "$log"
          rc=$?
          set -e

          cat "$log" || true

          if [ ! -s "$apk" ]; then
            echo "APK is missing or empty after Unity build: $apk" >&2
            [ "$rc" -ne 0 ] && exit "$rc"
            exit 1
          fi

          if ! grep -Fq 'Fallen Forest APK built:' "$log"; then
            echo 'Unity did not emit the successful Fallen Forest build marker.' >&2
            exit 1
          fi

          unzip -tqq "$apk" || {
            echo 'APK ZIP structure validation failed.' >&2
            exit 1
          }
          echo "APK structure validated: $(du -h "$apk" | cut -f1)"

          if [ "$rc" -eq 0 ]; then
            echo 'Unity Android build completed cleanly.'
            exit 0
          fi

          if [ "$rc" -eq 134 ] \
            && grep -Fq 'Batchmode quit successfully invoked - shutting down!' "$log" \
            && grep -Fq 'Cannot create web request without initializing the system' "$log" \
            && grep -Fq 'UnityEngine::Analytics::DataDispatcher' "$log"; then
            echo '::warning::Unity 6 Linux Editor hit the verified Analytics shutdown race after a validated successful APK build; accepting the artifact.'
            exit 0
          fi

          echo "Unity returned exit code $rc after producing the APK, but it was not the verified shutdown race." >&2
          exit "$rc"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fallen-Forest-Android-APK
          path: Builds/Android/Fallen_Forest_1.0.0.apk
          if-no-files-found: error
          compression-level: 0
