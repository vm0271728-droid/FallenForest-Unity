# Cloud Unity Personal build; secrets are configured in GitHub Actions
name: Build Fallen Forest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: fallen-forest-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout project and LFS assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch vetted CC0 menu and forest ambience
        run: python3 Tools/fetch_cc0_audio.py

      - name: Verify Unity ID credentials exist
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_USERNAME" || { echo 'Missing GitHub secret: UNITY_USERNAME'; exit 2; }
          test -n "$UNITY_PASSWORD" || { echo 'Missing GitHub secret: UNITY_PASSWORD'; exit 2; }

      - name: Free disk for Unity Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo 'Disk after cleanup:'
          df -h /

      - name: Install official Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          unity --version

      - name: Install Unity 6.0.76f1 editor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          unity install 6000.0.76f1 \
            -c 6f7f9e1c9e8a \
            --accept-eula \
            --format ndjson
          unity editors -i --format json || true

      - name: Install Android Build Support and child modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          editor="$(find "$HOME" -type f -path '*/6000.0.76f1/Editor/Unity' -perm -111 -print -quit 2>/dev/null || true)"
          if [ -z "$editor" ]; then
            editor="$(find /opt -type f -path '*/6000.0.76f1/Editor/Unity' -perm -111 -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$editor" ]; then
            echo 'Unity 6000.0.76f1 installed, but Editor executable could not be located.' >&2
            find "$HOME" -maxdepth 8 -type f -name Unity -perm -111 -print 2>/dev/null || true
            exit 1
          fi

          echo "UNITY_EDITOR_PATH=$editor" >> "$GITHUB_ENV"
          echo "Resolved Unity Editor: $editor"

          android_player="$(dirname "$editor")/Data/PlaybackEngines/AndroidPlayer"

          # First let Unity's own experimental CLI install everything it can. On beta.5 the r27c
          # extractor can fail on a fresh Linux runner even after the SDK/JDK/base Android module
          # have been installed successfully, so a non-zero result here is not immediately fatal.
          set +e
          unity install-modules \
            -e 6000.0.76f1 \
            -m android \
            --cm \
            --accept-eula \
            --format ndjson
          unity_module_rc=$?
          set -e
          echo "Unity install-modules exit code: $unity_module_rc"

          test -d "$android_player" || { echo "Android Build Support directory missing: $android_player" >&2; exit 1; }
          test -f "$android_player/UnityEditor.Android.Extensions.dll" || {
            echo 'Base Android Build Support did not install.' >&2
            find "$android_player" -maxdepth 2 -type f | head -80 || true
            exit 1
          }
          test -d "$android_player/SDK/platform-tools" || { echo 'Unity Android SDK child module is missing or incomplete.' >&2; exit 1; }
          test -x "$android_player/OpenJDK/bin/java" || { echo 'Unity OpenJDK child module is missing or incomplete.' >&2; exit 1; }

          # Unity 6.0.76f1 metadata asks for NDK r27c. If the Unity CLI hit its known extraction-path
          # failure, use the already-installed official Android command-line tools to install the
          # exact side-by-side r27c package, then place that toolchain where Unity expects it.
          if [ ! -f "$android_player/NDK/source.properties" ]; then
            echo 'Unity CLI did not finish NDK r27c; installing exact r27c with Android sdkmanager fallback.'
            sdkmanager="$(find "$android_player/SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 -print 2>/dev/null | sort -V | tail -1)"
            test -n "$sdkmanager" || { echo 'sdkmanager was not installed by Unity Android SDK tools.' >&2; exit 1; }

            export JAVA_HOME="$android_player/OpenJDK"
            export PATH="$JAVA_HOME/bin:$PATH"

            yes | "$sdkmanager" --sdk_root="$android_player/SDK" --licenses >/dev/null || true
            "$sdkmanager" --sdk_root="$android_player/SDK" "ndk;27.2.12479018"

            side_ndk="$android_player/SDK/ndk/27.2.12479018"
            test -f "$side_ndk/source.properties" || {
              echo 'sdkmanager completed but r27c source.properties is missing.' >&2
              find "$android_player/SDK/ndk" -maxdepth 2 -type f -name source.properties -print || true
              exit 1
            }

            rm -rf "$android_player/NDK"
            mkdir -p "$android_player/NDK"
            cp -a "$side_ndk"/. "$android_player/NDK"/
          fi

          test -f "$android_player/NDK/source.properties" || { echo 'Unity Android NDK is missing or incomplete after fallback.' >&2; exit 1; }
          grep -E 'Pkg.Revision|Pkg.Desc' "$android_player/NDK/source.properties" || cat "$android_player/NDK/source.properties"
          "$android_player/OpenJDK/bin/java" -version
          echo 'Android toolchain validation passed.'
          df -h /

      - name: Activate Unity Personal on the cloud runner
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Compile/import Unity project
        shell: bash
        run: |
          set -euo pipefail
          test -x "$UNITY_EDITOR_PATH"
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -logFile -

      - name: Verify final release media and creature models
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          require_file() { if [ ! -f "$1" ]; then echo "MISSING FILE: $1"; missing=1; fi; }
          require_model() {
            local dir="$1"
            if [ ! -d "$dir" ]; then echo "MISSING MODEL DIRECTORY: $dir"; missing=1; return; fi
            if ! find "$dir" -type f \( -iname '*.fbx' -o -iname '*.obj' -o -iname '*.gltf' -o -iname '*.glb' \) -print -quit | grep -q .; then
              echo "MISSING 3D MODEL FILE: $dir"; missing=1
            fi
          }
          require_file Assets/FallenForest/Audio/Menu/creepy_forest_menu.ogg
          require_file Assets/FallenForest/Audio/Ambience/forest_ambience_cc0.mp3
          require_file Assets/FallenForest/Audio/Ambience/ambient_horror_cc0.ogg
          require_file Assets/FallenForest/Audio/Screamers/jakes-screamer.mp3
          require_file Assets/FallenForest/Audio/Screamers/the-screamer-shared-between-mallie-and-jenny.mp3
          require_file Assets/FallenForest/Video/boiled_one_jumpscare.mp4
          if [ -f Assets/FallenForest/Audio/Screamers/amazing-grace-analog-horror.mp3 ]; then echo 'FORBIDDEN FILE PRESENT: amazing-grace-analog-horror.mp3'; missing=1; fi
          require_model Assets/FallenForest/Art/Models/DoctorNowhere/Locust
          require_model Assets/FallenForest/Art/Models/DoctorNowhere/Boiled
          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build development-signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod FallenForest.EditorTools.FallenForestProjectBuilder.CIBuildAndroid \
            -logFile -

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fallen-Forest-Android-APK
          path: Builds/Android/Fallen_Forest_1.0.0.apk
          if-no-files-found: error
          compression-level: 0
