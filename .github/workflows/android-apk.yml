# Cloud Unity Personal build; secrets are configured in GitHub Actions
name: Build Fallen Forest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: fallen-forest-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout project and LFS assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch vetted CC0 menu and forest ambience
        run: python3 Tools/fetch_cc0_audio.py

      - name: Verify Unity ID credentials exist
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_USERNAME" || { echo 'Missing GitHub secret: UNITY_USERNAME'; exit 2; }
          test -n "$UNITY_PASSWORD" || { echo 'Missing GitHub secret: UNITY_PASSWORD'; exit 2; }

      - name: Free disk for Unity Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo 'Disk after cleanup:'
          df -h /

      - name: Install Unity Hub and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub-dist.unity3d.com/artifactory/hub-debian-prod-local stable main' | sudo tee /etc/apt/sources.list.d/unityhub.list >/dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unityhub xvfb

          # Hub 3.20+ installs the real executable and Unity.Licensing.Client under /usr/lib/unityhub.
          # /usr/bin/unityhub is only the launcher entry and causes buildalon licensing to search /usr/bin/**.
          if [ -x /usr/lib/unityhub/unityhub ]; then
            hub=/usr/lib/unityhub/unityhub
          elif [ -x /opt/unityhub/unityhub ]; then
            hub=/opt/unityhub/unityhub
          else
            hub="$(command -v unityhub)"
          fi
          test -x "$hub" || { echo 'Unity Hub package installed but executable was not found.' >&2; exit 1; }

          licensing_client="$(find "$(dirname "$hub")" -maxdepth 5 -type f -name Unity.Licensing.Client -perm -111 -print -quit 2>/dev/null || true)"
          test -n "$licensing_client" || {
            echo "Unity.Licensing.Client was not found under the real Hub directory: $(dirname "$hub")" >&2
            find "$(dirname "$hub")" -maxdepth 5 -type f -iname '*Licensing*' -print 2>/dev/null | head -80 || true
            exit 1
          }

          echo "UNITY_HUB_PATH=$hub" >> "$GITHUB_ENV"
          echo "Unity Hub installed at: $hub"
          echo "Unity Licensing Client: $licensing_client"

          # Unity's current Linux Hub CLI syntax is `unityhub --headless ...`.
          # Hub is Electron-based, so run its headless CLI under Xvfb on CI.
          xvfb-run -a "$hub" --headless help --errors | head -80

      - name: Install Unity 6.0.76f1 and Android modules with Hub CLI
        shell: bash
        run: |
          set -euo pipefail
          install_root="$HOME/Unity/Hub/Editor"
          mkdir -p "$install_root"

          xvfb-run -a "$UNITY_HUB_PATH" --headless install-path -s "$install_root" --errors

          # Install Android as the parent module and include all child modules non-interactively.
          xvfb-run -a "$UNITY_HUB_PATH" --headless install \
            --version 6000.0.76f1 \
            --changeset 6f7f9e1c9e8a \
            --module android \
            --childModules \
            --errors

          xvfb-run -a "$UNITY_HUB_PATH" --headless editors -i --errors || true

          editor="$install_root/6000.0.76f1/Editor/Unity"
          if [ ! -x "$editor" ]; then
            editor="$(find "$HOME/Unity" -type f -path '*/6000.0.76f1/Editor/Unity' -perm -111 -print -quit 2>/dev/null || true)"
          fi
          test -x "$editor" || {
            echo 'Unity 6000.0.76f1 did not produce an Editor executable.' >&2
            find "$HOME/Unity" -maxdepth 8 -type f -name Unity -perm -111 -print 2>/dev/null || true
            exit 1
          }
          echo "UNITY_EDITOR_PATH=$editor" >> "$GITHUB_ENV"
          echo "Resolved Unity Editor: $editor"

      - name: Verify Unity Android installation
        shell: bash
        run: |
          set -euo pipefail
          test -x "$UNITY_EDITOR_PATH" || { echo 'Unity editor executable is missing.' >&2; exit 1; }
          android_player="$(dirname "$UNITY_EDITOR_PATH")/Data/PlaybackEngines/AndroidPlayer"
          test -d "$android_player" || { echo "Android Build Support missing: $android_player" >&2; exit 1; }
          test -f "$android_player/UnityEditor.Android.Extensions.dll" || { echo 'Unity Android editor extension missing.' >&2; exit 1; }
          test -d "$android_player/SDK/platform-tools" || { echo 'Unity Android SDK missing/incomplete.' >&2; exit 1; }
          test -f "$android_player/NDK/source.properties" || { echo 'Unity Android NDK missing/incomplete.' >&2; find "$android_player/NDK" -maxdepth 2 -type f -print 2>/dev/null | head -40 || true; exit 1; }
          test -x "$android_player/OpenJDK/bin/java" || { echo 'Unity OpenJDK missing/incomplete.' >&2; exit 1; }
          grep -E 'Pkg.Revision|Pkg.Desc' "$android_player/NDK/source.properties" || cat "$android_player/NDK/source.properties"
          "$android_player/OpenJDK/bin/java" -version
          echo 'Unity Android toolchain validation passed.'
          df -h /

      - name: Activate Unity Personal on the cloud runner
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Compile/import Unity project
        shell: bash
        run: |
          set -euo pipefail
          test -x "$UNITY_EDITOR_PATH"
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -logFile -

      - name: Verify final release media and creature models
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          require_file() { if [ ! -f "$1" ]; then echo "MISSING FILE: $1"; missing=1; fi; }
          require_model() {
            local dir="$1"
            if [ ! -d "$dir" ]; then echo "MISSING MODEL DIRECTORY: $dir"; missing=1; return; fi
            if ! find "$dir" -type f \( -iname '*.fbx' -o -iname '*.obj' -o -iname '*.gltf' -o -iname '*.glb' \) -print -quit | grep -q .; then
              echo "MISSING 3D MODEL FILE: $dir"; missing=1
            fi
          }
          require_file Assets/FallenForest/Audio/Menu/creepy_forest_menu.ogg
          require_file Assets/FallenForest/Audio/Ambience/forest_ambience_cc0.mp3
          require_file Assets/FallenForest/Audio/Ambience/ambient_horror_cc0.ogg
          require_file Assets/FallenForest/Audio/Screamers/jakes-screamer.mp3
          require_file Assets/FallenForest/Audio/Screamers/the-screamer-shared-between-mallie-and-jenny.mp3
          require_file Assets/FallenForest/Video/boiled_one_jumpscare.mp4
          if [ -f Assets/FallenForest/Audio/Screamers/amazing-grace-analog-horror.mp3 ]; then echo 'FORBIDDEN FILE PRESENT: amazing-grace-analog-horror.mp3'; missing=1; fi
          require_model Assets/FallenForest/Art/Models/DoctorNowhere/Locust
          require_model Assets/FallenForest/Art/Models/DoctorNowhere/Boiled
          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build development-signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod FallenForest.EditorTools.FallenForestProjectBuilder.CIBuildAndroid \
            -logFile -

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fallen-Forest-Android-APK
          path: Builds/Android/Fallen_Forest_1.0.0.apk
          if-no-files-found: error
          compression-level: 0
