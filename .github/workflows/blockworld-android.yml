name: BlockWorld Android APK

on:
  push:
    branches: [blockworld-godot-build]
    paths:
      - 'BlockWorld_CI_Source.part*'
      - '.github/workflows/blockworld-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'BlockWorld_CI_Source.part*'
      - '.github/workflows/blockworld-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_RELEASE: '4.6.3-stable'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch BlockWorld source
        shell: bash
        run: |
          set -euxo pipefail
          cat BlockWorld_CI_Source.part* > "$RUNNER_TEMP/BlockWorld_Source.zip.b64"
          base64 -d "$RUNNER_TEMP/BlockWorld_Source.zip.b64" > "$RUNNER_TEMP/BlockWorld_Source.zip"
          unzip -q "$RUNNER_TEMP/BlockWorld_Source.zip" -d .
          test -f BlockWorld/project.godot
          python3 - <<'PY'
          from pathlib import Path
          main = Path('BlockWorld/scripts/main.gd')
          text = main.read_text()
          text = text.replace('var cc:=chunk_queue.pop_front()', 'var cc:Vector2i=chunk_queue.pop_front()')
          text = text.replace('var cc:=rebuild_queue.pop_front()', 'var cc:Vector2i=rebuild_queue.pop_front()')
          main.write_text(text)
          chunk = Path('BlockWorld/scripts/chunk.gd')
          c = chunk.read_text()
          c = c.replace('var local_n := Vector3i(x,y,z) + DIRS[f]', 'var local_n: Vector3i = Vector3i(x,y,z) + Vector3i(DIRS[f])')
          c = c.replace('var gp := Vector3i(coord.x*SIZE+x, y, coord.y*SIZE+z) + DIRS[f]', 'var gp: Vector3i = Vector3i(coord.x*SIZE+x, y, coord.y*SIZE+z) + Vector3i(DIRS[f])')
          chunk.write_text(c)
          project = Path('BlockWorld/project.godot')
          p = project.read_text()
          marker = 'textures/canvas_textures/default_texture_filter=0'
          if 'textures/vram_compression/import_etc2_astc=true' not in p:
              p = p.replace(marker, marker + '\ntextures/vram_compression/import_etc2_astc=true')
          project.write_text(p)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages and emulator image
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;28.1.13356709' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/godot/editor.zip" "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/godot/templates.tpz" "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -maxdepth 2 -type f -name 'Godot_v*-stable_linux.x86_64' | head -n1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/template_unpack"
          cp -a "$RUNNER_TEMP/godot/template_unpack/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "$GODOT_BIN" --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Configure Godot Android paths and debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Headless import and parser check
        shell: bash
        run: |
          set -euxo pipefail
          "$GODOT_BIN" --headless --editor --path BlockWorld --quit-after 8 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi

      - name: Export APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          mkdir -p BlockWorld/build
          "$GODOT_BIN" --headless --verbose --path BlockWorld --export-debug Android build/BlockWorld.apk
          test -s BlockWorld/build/BlockWorld.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t BlockWorld/build/BlockWorld.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose BlockWorld/build/BlockWorld.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging BlockWorld/build/BlockWorld.apk | tee BlockWorld/build/apk-badging.txt
          sha256sum BlockWorld/build/BlockWorld.apk | tee BlockWorld/build/BlockWorld.apk.sha256

      - name: Install and launch APK in Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo no | avdmanager create avd --force --name blockworld-ci --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd blockworld-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          BOOTED=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then BOOTED=1; break; fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          adb install -r BlockWorld/build/BlockWorld.apk | tee BlockWorld/build/install-result.txt
          adb logcat -c
          adb shell monkey -p com.example.blockworld -c android.intent.category.LAUNCHER 1
          sleep 10
          PID="$(adb shell pidof com.example.blockworld | tr -d '\r')"
          echo "PID=$PID" | tee BlockWorld/build/runtime-smoke.txt
          test -n "$PID"
          adb logcat -d > BlockWorld/build/runtime-logcat.txt
          if grep -E 'FATAL EXCEPTION|ANR in com\.example\.blockworld' BlockWorld/build/runtime-logcat.txt; then exit 1; fi

      - name: Package source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf BlockWorld/.godot BlockWorld/build/BlockWorld_Source.zip
          (cd BlockWorld && zip -qr build/BlockWorld_Source.zip . -x 'build/BlockWorld_Source.zip')

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-Android
          if-no-files-found: error
          retention-days: 7
          path: |
            BlockWorld/build/BlockWorld.apk
            BlockWorld/build/BlockWorld.apk.sha256
            BlockWorld/build/apk-badging.txt
            BlockWorld/build/install-result.txt
            BlockWorld/build/runtime-smoke.txt
            BlockWorld/build/runtime-logcat.txt
            BlockWorld/build/BlockWorld_Source.zip
