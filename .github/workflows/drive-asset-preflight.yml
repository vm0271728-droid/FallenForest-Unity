name: Fallen Forest Drive asset preflight

on:
  push:
    branches: [ integration/release-mainline ]
    paths:
      - '.github/workflows/drive-asset-preflight.yml'
      - 'Tools/import_all_needed_archive.py'
      - 'Tools/import_tree_archive.py'
  workflow_dispatch:

jobs:
  preflight:
    name: Download and validate canonical release archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release integration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: false

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y p7zip-full; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y 7zip
          fi
          command -v 7z || command -v 7zz || command -v 7za

      - name: Download canonical archives from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'gdown>=5.2,<6'

          python3 -m gdown 'https://drive.google.com/uc?id=1W9RzSrC8SWn1BJCa_i0OU2Wkk0L0LQe6' -O all-needed.zip
          test -f all-needed.zip
          test "$(stat -c %s all-needed.zip)" = '85825470'
          echo '0848ea17b01f750747a37e3af9b0e74723efcba58a253c20e798e30b41a5e9d8  all-needed.zip' | sha256sum -c -

          python3 -m gdown 'https://drive.google.com/uc?id=11nhh2Q0djgdQm653EQkWJjqSpdJ9SEFk' -O trees.zip
          test -f trees.zip
          test "$(stat -c %s trees.zip)" = '198111913'
          echo '13cc391a560ebddae59d3940a5f17a02083fd1f1f487fdeaba8dea5401df3363  trees.zip' | sha256sum -c -

      - name: Import exact user release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/import_all_needed_archive.py all-needed.zip
          python3 Tools/import_tree_archive.py trees.zip

      - name: Verify imported source payload
        shell: bash
        run: |
          set -euo pipefail
          require_file() { test -f "$1" || { echo "MISSING AFTER IMPORT: $1" >&2; exit 3; }; }
          require_file Assets/FallenForest/Art/Vegetation/UserGrass/Source/Grass.fbx
          require_file Assets/FallenForest/Art/Viewmodel/Arms/Source/fpsarms.fbx
          require_file Assets/FallenForest/Art/Viewmodel/Flashlight/Source/flashlightfbx.fbx
          require_file Assets/FallenForest/Art/Documents/UserDocument/Source/document_file_folder.obj
          require_file 'Assets/FallenForest/Art/Vehicles/Pickup/Source/Pickup Afghanistan.fbx'
          require_file 'Assets/FallenForest/Art/Models/DoctorNowhere/Locust/Source/T_O_E Locust - By Doumty.fbx'
          require_file Assets/FallenForest/Art/Models/DoctorNowhere/Boiled/Source/BoiledOne.fbx
          require_file Assets/FallenForest/Audio/Screamers/jakes-screamer.mp3
          require_file Assets/FallenForest/Audio/Screamers/the-screamer-shared-between-mallie-and-jenny.mp3
          require_file Assets/StreamingAssets/FallenForest/Video/boiled_one_jumpscare.mp4
          require_file 'Assets/FallenForest/Art/Vegetation/UserTrees/BlackSpruce/Source/Picea mariana HD_Arctic mat 100_LOD0.fbx'
          require_file 'Assets/FallenForest/Art/Vegetation/UserTrees/BlackSpruce/Source/zzz_LODs/LOD1/Picea mariana HD_Arctic mat 100_LOD1.fbx'
          require_file 'Assets/FallenForest/Art/Vegetation/UserTrees/BlackSpruce/Source/zzz_LODs/LOD2/Picea mariana HD_Arctic mat 100_LOD2.fbx'
          require_file 'Assets/FallenForest/Art/Vegetation/UserTrees/BlackSpruce/Source/zzz_LODs/LOD3/Picea mariana HD_Arctic mat 100_LOD3.fbx'
          require_file 'Assets/FallenForest/Art/Vegetation/UserTrees/BlackSpruce/Source/zzz_LODs/LOD4/Picea mariana HD_Arctic mat 100_LOD4.fbx'
          require_file Assets/FallenForest/Art/Vegetation/UserTrees/DeadFirs/Source/firs.obj
          require_file 'Assets/FallenForest/Art/Vegetation/UserTrees/LowPolyForest/Source/LOW POLY FOREST TREE PACK.rar'
          require_file Assets/FallenForest/Art/Vegetation/UserTrees/LowPolyForest/Source/Extracted/Tree_Pack.fbx
          require_file Assets/FallenForest/Art/Vegetation/UserTrees/LowPolyForest/Source/Extracted/Tree_Pack.obj
          require_file Assets/FallenForest/Art/Vegetation/UserTrees/LowPolyForest/Source/Extracted/Tree_Pack.mtl
          test ! -f Assets/FallenForest/Audio/Screamers/amazing-grace-analog-horror.mp3
          echo 'Canonical Drive payloads imported and validated successfully.'
